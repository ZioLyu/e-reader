[package]
name = "e-reader"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "e_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
